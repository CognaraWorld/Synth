name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy"
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cognaraworld/synth
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate tag input
        if: github.event_name == 'workflow_dispatch'
        run: echo "${{ github.event.inputs.tag }}" | grep -qE '^[a-zA-Z0-9._-]+$' || exit 1

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /srv/synth
            export IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
            docker compose pull backend
            docker compose up -d backend
            docker image prune -f
            # wait for health
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then
                echo "Backend healthy"; exit 0
              fi
              sleep 2
            done
            echo "Backend failed to become healthy"; exit 1
