name: CI

# The current org policy does not allow normal pull_request workflows from
# private forks, so trusted fork PRs use a constrained pull_request_target
# fallback. Keep token scope read-only and do not widen the trusted list
# without re-evaluating the security tradeoff.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) ||
      (github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.fork == true &&
      contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.pull_request.author_association))
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          # pull_request_target runs on the base ref; use the PR merge ref to validate contributor changes.
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Syntax check all Python files
        run: python -m py_compile app/main.py && find app -name "*.py" -exec python -m py_compile {} +

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) ||
      (github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.fork == true &&
      contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.pull_request.author_association))
    needs: backend-lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synth
          POSTGRES_PASSWORD: synth
          POSTGRES_DB: synth
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U synth"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full test suite
        env:
          DATABASE_URL: postgresql://synth:synth@localhost:5432/synth
          SECRET_KEY: ci-test-key-not-for-production
          ENVIRONMENT: development
        run: >
          TOKENIZERS_PARALLELISM=false
          python -m pytest tests/
          -k "not slow and not SearchClientResults and not VisionProcessor"
          -v --tb=short

  backend-security:
    name: Security Check
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) ||
      (github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.fork == true &&
      contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.pull_request.author_association))
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check for hardcoded secrets
        run: |
          ! grep -rn "sk-ant-\|sk-proj-\|AIza\|ghp_\|ghs_" app/ --include="*.py" || (echo "Hardcoded secret found!" && exit 1)
      - name: Check no .env committed
        run: |
          ! test -f .env || (echo ".env file should not be committed!" && exit 1)

  frontend-build:
    name: Frontend Lint + Type Check + Build
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) ||
      (github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.fork == true &&
      contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.pull_request.author_association))

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  schema-check:
    name: Schema Drift Check
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) ||
      (github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.fork == true &&
      contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.pull_request.author_association))
    needs: backend-lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synth
          POSTGRES_PASSWORD: synth
          POSTGRES_DB: synth
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U synth"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify migrations apply cleanly
        env:
          DATABASE_URL: postgresql://synth:synth@localhost:5432/synth
          SECRET_KEY: ci-test-key-not-for-production
          ENVIRONMENT: development
        run: |
          python -c "
          import asyncio
          from app.models.database import engine, Base
          from app.main import _run_migrations
          async def check():
              async with engine.begin() as conn:
                  await conn.run_sync(Base.metadata.create_all)
                  await conn.run_sync(_run_migrations)
                  print('Schema + migrations applied successfully')
          asyncio.run(check())
          "
