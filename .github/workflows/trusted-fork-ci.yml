name: Trusted Fork CI

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: trusted-fork-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: Trusted Fork Guard
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.evaluate.outputs.should_run }}
      checkout_ref: ${{ steps.evaluate.outputs.checkout_ref }}
    steps:
      - name: Evaluate trusted fork policy
        id: evaluate
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          IS_TRUSTED_ASSOCIATION: ${{ contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.pull_request.author_association) }}
        run: |
          if [ "${IS_FORK}" = "true" ] && [ "${IS_TRUSTED_ASSOCIATION}" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=refs/pull/${{ github.event.pull_request.number }}/merge" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_run=false" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=" >> "$GITHUB_OUTPUT"

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.guard.outputs.checkout_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Syntax check all Python files
        run: python -m py_compile app/main.py && find app -name "*.py" -exec python -m py_compile {} +

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [guard, backend-lint]
    if: needs.guard.outputs.should_run == 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synth
          POSTGRES_PASSWORD: synth
          POSTGRES_DB: synth
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U synth"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.guard.outputs.checkout_ref }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full test suite
        env:
          DATABASE_URL: postgresql://synth:synth@localhost:5432/synth
          SECRET_KEY: ci-test-key-not-for-production
          ENVIRONMENT: development
        run: >
          TOKENIZERS_PARALLELISM=false
          python -m pytest tests/
          -k "not slow and not SearchClientResults and not VisionProcessor"
          -v --tb=short

  backend-security:
    name: Security Check
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.guard.outputs.checkout_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check for hardcoded secrets
        run: |
          ! grep -rn "sk-ant-\|sk-proj-\|AIza\|ghp_\|ghs_" app/ --include="*.py" || (echo "Hardcoded secret found!" && exit 1)
      - name: Check no .env committed
        run: |
          ! test -f .env || (echo ".env file should not be committed!" && exit 1)

  frontend-build:
    name: Frontend Lint + Type Check + Build
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.should_run == 'true'

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.guard.outputs.checkout_ref }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  schema-check:
    name: Schema Drift Check
    runs-on: ubuntu-latest
    needs: [guard, backend-lint]
    if: needs.guard.outputs.should_run == 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synth
          POSTGRES_PASSWORD: synth
          POSTGRES_DB: synth
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U synth"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.guard.outputs.checkout_ref }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify migrations apply cleanly
        env:
          DATABASE_URL: postgresql://synth:synth@localhost:5432/synth
          SECRET_KEY: ci-test-key-not-for-production
          ENVIRONMENT: development
        run: |
          python -c "
          import asyncio
          from app.models.database import engine, Base
          from app.main import _run_migrations
          async def check():
              async with engine.begin() as conn:
                  await conn.run_sync(Base.metadata.create_all)
                  await conn.run_sync(_run_migrations)
                  print('Schema + migrations applied successfully')
          asyncio.run(check())
          "
