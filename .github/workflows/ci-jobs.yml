name: CI Jobs

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref to checkout (leave empty for default)"
        type: string
        default: ""
      persist_credentials:
        description: "Whether to persist git credentials after checkout"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || '' }}
          persist-credentials: ${{ inputs.persist_credentials }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Syntax check all Python files
        run: python -m py_compile app/main.py && find app -name "*.py" -exec python -m py_compile {} +
      - name: Install mypy
        run: pip install mypy==1.13.0
      - name: Type check (strict — critical paths)
        # BLOCKING. These three modules are on the hot path for auth, LLM
        # routing, and Recall.ai integration — regressions here have caused
        # prod incidents, so strict-optional is enforced. Add more files to
        # this list at Checkpoint 2 once Devyansh's engine_singleton lands.
        run: |
          mypy \
            app/api/routes/auth.py \
            app/core/llm.py \
            app/meeting/recall_client.py \
            --ignore-missing-imports \
            --strict-optional
      - name: Type check (advisory — rest)
        # Advisory until Devyansh's SQLAlchemy 2.0 Mapped[T] migration
        # lands — the legacy Column[T] mappings currently produce ~100 false
        # positives. Running mypy here still surfaces regressions on files
        # that are already clean, and the job exits 0 on any errors.
        continue-on-error: true
        run: mypy app/ --ignore-missing-imports --show-error-codes --pretty

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synth
          POSTGRES_PASSWORD: synth
          POSTGRES_DB: synth
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U synth"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || '' }}
          persist-credentials: ${{ inputs.persist_credentials }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install test tooling
        run: pip install pytest-cov==6.0.0

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run full test suite with coverage
        env:
          DATABASE_URL: postgresql://synth:synth@localhost:5432/synth
          SECRET_KEY: ci-test-key-not-for-production
          ENVIRONMENT: development
        # Coverage threshold starts permissive (30%) and should be ratcheted
        # up as coverage improves. The hard floor exists so "remove a test"
        # fails CI even if the removed test was the only thing covering a
        # module. See AUDIT-REPORT-2026-04-16.md section 4 for gap analysis.
        run: >
          TOKENIZERS_PARALLELISM=false
          python -m pytest tests/
          -k "not slow and not SearchClientResults and not VisionProcessor"
          -v --tb=short
          --cov=app --cov-report=term-missing --cov-report=xml
          --cov-fail-under=30

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

  backend-security:
    name: Security Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || '' }}
          persist-credentials: ${{ inputs.persist_credentials }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Check for hardcoded secrets
        run: |
          ! grep -rn "sk-ant-\|sk-proj-\|AIza\|ghp_\|ghs_" app/ --include="*.py" || (echo "Hardcoded secret found!" && exit 1)
      - name: Check no .env committed
        run: |
          ! test -f .env || (echo ".env file should not be committed!" && exit 1)
      - name: Install pip-audit
        run: pip install pip-audit==2.7.3
      - name: Audit Python dependencies
        # pip-audit is BLOCKING. The two --ignore-vuln flags below are a
        # temporary allowlist for the known python-jose CVEs (ECDSA
        # algorithm confusion + JWT bomb DoS). Devyansh's A11 removes
        # python-jose from requirements.txt in favour of PyJWT; once that
        # lands, DROP both --ignore-vuln flags so any future jose CVE (or
        # any other CVE) blocks the merge.
        # Owner of removing these ignores: Devyansh (track-backend).
        run: pip-audit --requirement requirements.txt --strict --desc --ignore-vuln GHSA-cjwg-qfpm-7377 --ignore-vuln PYSEC-2024-233

  frontend-build:
    name: Frontend Lint + Type Check + Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || '' }}
          persist-credentials: ${{ inputs.persist_credentials }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  schema-check:
    name: Schema Drift Check
    runs-on: ubuntu-latest
    needs: backend-lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synth
          POSTGRES_PASSWORD: synth
          POSTGRES_DB: synth
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U synth"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || '' }}
          persist-credentials: ${{ inputs.persist_credentials }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify migrations apply cleanly
        env:
          DATABASE_URL: postgresql://synth:synth@localhost:5432/synth
          SECRET_KEY: ci-test-key-not-for-production
          ENVIRONMENT: development
        run: |
          python -c "
          import asyncio
          from app.models.database import engine, Base
          from app.main import _run_migrations
          async def check():
              async with engine.begin() as conn:
                  await conn.run_sync(Base.metadata.create_all)
                  await conn.run_sync(_run_migrations)
                  print('Schema + migrations applied successfully')
          asyncio.run(check())
          "
