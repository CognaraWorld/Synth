services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synth
      POSTGRES_PASSWORD: synth
      POSTGRES_DB: synth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080

volumes:
  postgres_data:
